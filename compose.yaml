name: ${COMPOSE_PROJECT_NAME:-nix-os}

services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:2026.916.1@sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c
    entrypoint: ["/opt/nix/paperclip-entrypoint.sh"]
    restart: unless-stopped
    pids_limit: 2048
    env_file:
      - ${PAPERCLIP_ENV_FILE:?Set PAPERCLIP_ENV_FILE to an absolute secret-file path}
      - ${FOUNDER_RELAY_ENV_FILE:?Set FOUNDER_RELAY_ENV_FILE to an absolute secret-file path}
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_INSTANCE_ID: default
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?Set PAPERCLIP_PUBLIC_URL in the Compose environment file}
      PAPERCLIP_RUNNER_PUBLIC_URL: ${PAPERCLIP_RUNNER_PUBLIC_URL:?Set PAPERCLIP_RUNNER_PUBLIC_URL to the matching private wss origin}
      PAPERCLIP_ALLOWED_HOSTNAMES: paperclip
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: ${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-false}
      PAPERCLIP_ENABLE_COMPANY_DELETION: "false"
      PAPERCLIP_SECRETS_STRICT_MODE: "true"
      PAPERCLIP_DB_BACKUP_ENABLED: "false"
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      PAPERCLIP_RUNNER_REMOTE_BINARY_PATH: /app/packages/paperclip-runner/dist/bin/paperclip-runnerd
      PAPERCLIP_RUNNER_REMOTE_PROVIDER_PACK_PATH: /runner-cache/nix-specialist-provider-pack
      NIX_PAPERCLIP_SPECIALIST_AGENT_IDS: ${NIX_SPECIALIST_AGENT_IDS:-}
      NIX_PAPERCLIP_FOUNDER_USER_ID: ${PAPERCLIP_LIOR_USER_ID:?Set PAPERCLIP_LIOR_USER_ID in the Compose environment file}
      PAPERCLIP_LIOR_USER_ID: ${PAPERCLIP_LIOR_USER_ID:?Set PAPERCLIP_LIOR_USER_ID in the Compose environment file}
      NIX_CHIEF_AGENT_ID: ${NIX_CHIEF_AGENT_ID:-}
      TRUST_PROXY: uniquelocal
    volumes:
      - paperclip_data:/paperclip
      - paperclip_runner_cache:/runner-cache
      - ./deploy/paperclip/entrypoint.sh:/opt/nix/paperclip-entrypoint.sh:ro
      - ./deploy/paperclip/patch-specialist-runtime.py:/opt/nix/patch-specialist-runtime.py:ro
    ports:
      - name: paperclip-local
        target: 3100
        published: ${PAPERCLIP_HOST_PORT:-3100}
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - app
      - data
      - agent
      - specialist
    depends_on:
      postgres:
        condition: service_healthy
      specialist-worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:3100/api/health | grep -q ''"status":"ok"'''
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    stop_grace_period: 30s

  specialist-worker:
    build:
      context: ./deploy/specialist-worker
    image: nix-specialist-worker:2026.10.20
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 256
    cpus: 1.0
    mem_limit: 2g
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    volumes:
      - specialist_workspaces:/workspaces
      - ${SPECIALIST_WORKER_HOST_KEY_FILE:?Set SPECIALIST_WORKER_HOST_KEY_FILE to the root-owned SSH host key}:/run/secrets/specialist_host_key:ro
      - ${SPECIALIST_WORKER_AUTHORIZED_KEYS_FILE:?Set SPECIALIST_WORKER_AUTHORIZED_KEYS_FILE to the root-owned authorized-keys file}:/run/secrets/specialist_authorized_keys:ro
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=256m,mode=1777
      - /home/worker/.cache:uid=10001,gid=10001,mode=0700,size=512m
      - /home/worker/.local:uid=10001,gid=10001,mode=0700,size=256m
    networks:
      - specialist
      - specialist_egress
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/sshd/sshd.pid && kill -0 $$(cat /run/sshd/sshd.pid)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 15s

  hermes:
    image: nousresearch/hermes-agent:v2026.9.14@sha256:99641e57ec762c59e54cb44aa6746b7fc68c18b3c5ddb088af54234c613d9294
    entrypoint: ["/bin/sh", "/opt/nix/entrypoint.sh"]
    restart: unless-stopped
    pids_limit: 2048
    group_add:
      - ${NIX_BRAIN_GID:?Set NIX_BRAIN_GID to the numeric group of NIX_BRAIN_HOST_PATH}
    env_file:
      - ${HERMES_ENV_FILE:?Set HERMES_ENV_FILE to an absolute secret-file path}
      - ${FOUNDER_RELAY_ENV_FILE:?Set FOUNDER_RELAY_ENV_FILE to an absolute secret-file path}
    environment:
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      HERMES_WRITE_SAFE_ROOT: /opt/data/memories
      PAPERCLIP_LIOR_USER_ID: ${PAPERCLIP_LIOR_USER_ID:?Set PAPERCLIP_LIOR_USER_ID in the Compose environment file}
      NIX_PAPERCLIP_SPECIALIST_AGENT_IDS: ${NIX_SPECIALIST_AGENT_IDS:-}
      WEBHOOK_ENABLED: "true"
      NIX_BRAIN_GID: ${NIX_BRAIN_GID:?Set NIX_BRAIN_GID to the numeric group of NIX_BRAIN_HOST_PATH}
    command: ["gateway", "run"]
    volumes:
      - hermes_data:/opt/data
      - ./deploy/hermes/config.yaml:/opt/data/config.yaml:ro
      - ./deploy/hermes/SOUL.md:/opt/data/SOUL.md:ro
      - ./deploy/hermes/entrypoint.sh:/opt/nix/entrypoint.sh:ro
      - ./deploy/hermes/startup-boundary.py:/opt/nix/startup-boundary.py:ro
      - ./deploy/hermes/claim-agent.py:/opt/nix/claim-agent.py:ro
      - ./deploy/hermes/verify-paperclip-mcp.py:/opt/nix/verify-paperclip-mcp.py:ro
      - ./deploy/hermes/validate-tool-boundary.py:/opt/nix/validate-tool-boundary.py:ro
      - ./deploy/hermes/patch-run-attribution.py:/opt/nix/patch-run-attribution.py:ro
      - ./deploy/hermes/run-scoped-paperclip-mcp.py:/opt/nix/run-scoped-paperclip-mcp.py:ro
      - ./deploy/hermes/paperclip_question_delivery.py:/opt/nix/paperclip_question_delivery.py:ro
      - ${HERMES_TELEGRAM_MODE_FILE:?Set HERMES_TELEGRAM_MODE_FILE to the root-owned external mode marker}:/run/nix/hermes-telegram-mode.env:ro
      - ${NIX_BRAIN_HOST_PATH:?Set NIX_BRAIN_HOST_PATH to the canonical nix-brain checkout}:/workspace/nix-brain:ro
    working_dir: /workspace
    networks:
      - hermes_egress
      - agent
    depends_on:
      paperclip:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 45s

  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    env_file:
      - ${POSTGRES_ENV_FILE:?Set POSTGRES_ENV_FILE to an absolute secret-file path}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-paperclip.sh:/docker-entrypoint-initdb.d/10-paperclip.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s

networks:
  app:
  hermes_egress:
  specialist_egress:
  data:
    internal: true
  agent:
    internal: true
  specialist:
    internal: true

volumes:
  paperclip_data:
    name: ${COMPOSE_PROJECT_NAME:-nix-os}_paperclip_data
  paperclip_runner_cache:
    name: ${COMPOSE_PROJECT_NAME:-nix-os}_paperclip_runner_cache
  specialist_workspaces:
    name: ${COMPOSE_PROJECT_NAME:-nix-os}_specialist_workspaces
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-nix-os}_postgres_data
  hermes_data:
    name: ${COMPOSE_PROJECT_NAME:-nix-os}_hermes_data
