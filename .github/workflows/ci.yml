name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes age jq shellcheck
      - name: Validate repository foundation
        env:
          REQUIRE_SHELLCHECK: "1"
        run: ./scripts/ci

  recovery:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install recovery dependencies
        run: sudo apt-get update && sudo apt-get install --yes age jq
      - name: Run Hermes contract and recovery integration
        # The provider lifecycle is unchanged in this slice and its upstream
        # fake-sandbox scheduler is timing-sensitive on hosted runners. Exercise
        # the exact compiled authority/delivery path deterministically here.
        run: NIX_TEST_AUTHORITY_ONLY=true RUN_DOCKER_SMOKE=1 ./scripts/ci
