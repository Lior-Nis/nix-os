model:
  provider: opencode-go
  default: gpt-5.6-luna

gateway:
  multiplex_profiles: false

# The Chief holds a long-lived Paperclip agent key. Every production invocation
# lane therefore uses the same explicit control-plane tool boundary. Do not use
# the broad hermes-* presets here: they include terminal, code, browser, and web
# capabilities that can bypass the Paperclip MCP allowlist.
platform_toolsets:
  cli: [file, memory, session_search, paperclip]
  telegram: [file, memory, session_search, paperclip]
  api_server: [file, memory, session_search, paperclip]

# Defense in depth if a future upstream resolver or preset changes. The
# concrete resolved tool surface is regression-tested from the pinned image.
agent:
  disabled_toolsets:
    - skills
    - terminal
    - code_execution
    - browser
    - web
    - connections
    - delegation
    - cronjob
    - computer_use

unauthorized_dm_behavior: ignore
platforms:
  telegram:
    unauthorized_dm_behavior: ignore
    guest_mode: false
    allow_bots: none
    gateway_restart_notification: false
    # Telegram group IDs are negative. Restricting allowed chats to Lior's
    # positive user ID makes Chief DM-only; task-scoped specialists have no
    # Telegram route or persistent Hermes profile.
    allowed_chats: ["${TELEGRAM_ALLOWED_USERS}"]
  webhook:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8644
      rate_limit: 10
      max_body_bytes: 16384
      routes:
        paperclip-decision:
          events: [paperclip.decision_required]
          prompt: "{message}"
          deliver: telegram
          deliver_only: true

mcp_servers:
  paperclip:
    command: python3
    args: ["/opt/nix/run-scoped-paperclip-mcp.py"]
    timeout: 90
    env:
      PAPERCLIP_API_URL: "http://paperclip:3100"
      PAPERCLIP_API_KEY: "${PAPERCLIP_API_KEY}"
      PAPERCLIP_COMPANY_ID: "${PAPERCLIP_COMPANY_ID}"
      PAPERCLIP_AGENT_ID: "${PAPERCLIP_AGENT_ID}"
      PAPERCLIP_LIOR_USER_ID: "${PAPERCLIP_LIOR_USER_ID}"
      HERMES_DECISION_WEBHOOK_SECRET: "${HERMES_DECISION_WEBHOOK_SECRET}"
      NIX_FOUNDER_RELAY_SECRET: "${NIX_FOUNDER_RELAY_SECRET}"
      NIX_PAPERCLIP_SPECIALIST_AGENT_IDS: "${NIX_PAPERCLIP_SPECIALIST_AGENT_IDS}"
      TELEGRAM_ALLOWED_USERS: "${TELEGRAM_ALLOWED_USERS}"
      TELEGRAM_HOME_CHANNEL: "${TELEGRAM_HOME_CHANNEL}"
    tools:
      include:
        - paperclipMe
        - paperclipListIssues
        - paperclipGetIssue
        - paperclipListComments
        - paperclipListProjects
        - paperclipGetProject
        - paperclipCreateIssue
        - paperclipCheckoutIssue
        - paperclipUpdateIssue
        - paperclipAddComment
        - paperclipAskUserQuestions
        - nixResolveFounderDecision
      resources: false
      prompts: false
